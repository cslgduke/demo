apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: demo-app-common-user
spec:
  hosts:
    - "*"
  gateways:
    - bookinfo-gateway
  http:
    - match:
        - uri:
            exact: /common/user
      fault:
#        delay:
#          percentage:
#            value: 50
#          fixedDelay: 5s
        abort:
          percentage:
            value: 50
          httpStatus: 503
      route:
        - destination:
            host: demo-service
            port:
              number: 80
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: "5xx"