apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: demo-gateway
spec:
  # The selector matches the ingress gateway pod labels.
  # If you installed Istio using Helm following the standard documentation, this would be "istio=ingress"
  selector:
    istio: ingressgateway # use istio default controller
  servers:
    - port:
        number: 8080
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: demo-app-service
spec:
  hosts:
    - "*"
  gateways:
    - demo-gateway
  http:
    - fault:
#        delay:
#          percentage:
#          fixedDelay: 5s
        abort:
          percentage:
            value: 50
          httpStatus: 503
      match:
        - headers:
            end-user:
              exact: jason
      route:
        - destination:
            host: demo-service
            port:
              number: 80

    - route:
        - destination:
            host: demo-service
            port:
              number: 80
        retries:
          attempts: 3
          perTryTimeout: 5s
          retryOn: "5xx"
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: demo-cb-policy
spec:
  host: demo-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1
      http:
        http2MaxRequests: 1
        maxRequestsPerConnection: 1
#    outlierDetection:
#      consecutive5xxErrors: 7
#      interval: 1m
#      baseEjectionTime: 15m