apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      run: nginx
  template:
    metadata:
      labels:
        run: nginx
    spec:
      volumes:
        - name: content-storage
          persistentVolumeClaim:
            claimName: nginx-pvc
#set html content permission to user nginx, but cant' work
#      initContainers:
#        - name: adjust-permissions
#          image: busybox
#          command: [ 'sh', '-c', 'chown -R 101:101 /usr/share/nginx/html; chmod -R 755 /usr/share/nginx/html' ]
#          volumeMounts:
#            - name: content-storage
#              mountPath: /usr/share/nginx/html
      containers:
      - name: nginx
        image: nginx
        securityContext:
          runAsUser: 0 #run container as root
        ports:
        - containerPort: 80
        volumeMounts:
          - mountPath: "/usr/share/nginx/html"
            name: content-storage
