  mysql:
    image: mysql
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      TZ: Asia/Shanghai
    ports:
      - 3306:3306
    volumes:
      - mysql:/var/lib/mysql

  redis:
    image: redis:6.0
    command: redis-server --requirepass default
    ports:
      - 16379:6379

  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
  kafka-service:
    image: wurstmeister/kafka
    ports:
      - 9092:9092
    volumes:
      - kafka:/var/run/docker.sock
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-service:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://kafka-service:9093,EXTERNAL://kafka-service:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper

volumes:
#  mypg1:
#  mypg2:
  mysql:
  kafka: