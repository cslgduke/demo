groups:
  - name: node_down
    rules:
      - alert: InstanceDown
        expr: up{job="application"} == 0
        for: 1m
        labels:
          severity: critical
          instance: "{{ $labels.instance }}"
          user: test
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minutes."
