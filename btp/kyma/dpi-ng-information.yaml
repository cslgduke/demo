apiVersion: services.cloud.sap.com/v1
kind: ServiceInstance
metadata:
  name: {{ .Release.Namespace }}-dpi-ng-information
  labels:
    cci.sap.com/managed-by: mmp-management-biz
spec:
  serviceOfferingName: data-privacy-integration-service
  servicePlanName: data-privacy-internal
  parameters:
    xs-security:
      xsappname: {{ .Release.Namespace }}-dpi-ng-information
      authorities:
        - "$ACCEPT_GRANTED_AUTHORITIES"
      oauth2-configuration:
        credential-types:
          - x509
          - binding-secret
    dataPrivacyConfiguration:
      configType: information
      applicationConfiguration:
        applicationName: SAP_RGM_{{ .Release.Namespace }}-kyma
        applicationTitle: SAP Revenue Growth Management
      informationConfiguration:
        applicationConfiguration:
          disableDataSubjectDeletion: true
        components:
          - componentName: rgp-dpp-proxy
            componentBaseURL: https://api.mtls.ugw.{{ .Values.nsDomain }}
            serviceEndPoints:
              - serviceName: rgp-dpp-proxy
                serviceFormat: rest
                serviceEndPoint: "/pdm"
                annotationProviderEndPoint: "/pdm/metadata"

---
apiVersion: services.cloud.sap.com/v1
kind: ServiceBinding
metadata:
  name: {{ .Release.Namespace }}-dpi-ng-information
  labels:
    cci.sap.com/managed-by: mmp-management-biz
spec:
  serviceInstanceName: {{ .Release.Namespace }}-dpi-ng-information
  secretName: {{ .Release.Namespace }}-dpi-ng-information